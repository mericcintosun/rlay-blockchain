[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# Pinned so builds are reproducible and the compiler version students enter
# on the block explorer during verification always matches.
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200

# Exercise contracts are compiled but not part of the main build target.
# Kasa.sol is intentionally vulnerable - see CLAUDE.md.

[rpc_endpoints]
base_sepolia = "${RPC_URL}"

[etherscan]
base_sepolia = { key = "${ETHERSCAN_API_KEY}" }
